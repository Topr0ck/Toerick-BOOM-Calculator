<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toerick Rust Helper</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0b0d;
      --card-bg: #111318;
      --panel-border: #232732;
      --rust-orange: #ff4400;
      --rust-glow: rgba(255, 68, 0, 0.25);
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --sulfur: #facc15;
      --charcoal: #94a3b8;
      --gp: #f97316;
      --lgf: #ef4444;
      --scrap: #38bdf8;
      --hqm: #a855f7;
      --cloth: #10b981;
      --metal: #60a5fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(10, 11, 13, 0.8), rgba(10, 11, 13, 1));
      background-size: 24px 24px, 100% 100%;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding: 32px 16px;
      min-height: 100vh;
    }

    .wrapper { max-width: 1200px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-left: 4px solid var(--rust-orange);
      margin-bottom: 20px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }

    .brand h1 {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #fff;
    }

    .brand h1 span { color: var(--rust-orange); text-shadow: 0 0 12px var(--rust-glow); }

    /* Navigation Tabs */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 12px 18px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      color: #fff;
      border-color: var(--rust-orange);
      background: rgba(255, 68, 0, 0.1);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Layout Grids */
    .grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 380px 1fr; } }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      padding: 24px;
      position: relative;
    }

    .panel-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 10px;
    }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

    select, input {
      width: 100%;
      background: #08090b;
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 12px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
    }

    select:focus, input:focus { border-color: var(--rust-orange); box-shadow: 0 0 10px var(--rust-glow); }

    .btn-action {
      width: 100%;
      background: var(--rust-orange);
      color: #fff;
      border: none;
      padding: 14px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-action:hover { background: #ff5511; box-shadow: 0 0 20px var(--rust-glow); }

    /* Resource Box Styling */
    .resource-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
    @media (min-width: 650px) { .resource-row { grid-template-columns: repeat(4, 1fr); } }

    .res-box { background: #08090b; border: 1px solid var(--panel-border); padding: 16px; position: relative; }
    .res-box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; }
    .res-box.sulfur::before { background: var(--sulfur); }
    .res-box.charcoal::before { background: var(--charcoal); }
    .res-box.gp::before { background: var(--gp); }
    .res-box.lgf::before { background: var(--lgf); }
    .res-box.scrap::before { background: var(--scrap); }
    .res-box.hqm::before { background: var(--hqm); }
    .res-box.cloth::before { background: var(--cloth); }
    .res-box.metal::before { background: var(--metal); }

    .res-box .val { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; margin-top: 6px; }
    .res-box.sulfur .val { color: var(--sulfur); }
    .res-box.charcoal .val { color: var(--charcoal); }
    .res-box.gp .val { color: var(--gp); }
    .res-box.lgf .val { color: var(--lgf); }
    .res-box.scrap .val { color: var(--scrap); }
    .res-box.hqm .val { color: var(--hqm); }
    .res-box.cloth .val { color: var(--cloth); }
    .res-box.metal .val { color: var(--metal); }

    /* Queue & Lists */
    .queue-list { list-style: none; margin-bottom: 20px; }
    .queue-item { display: flex; justify-content: space-between; align-items: center; background: #08090b; border: 1px solid var(--panel-border); border-left: 3px solid var(--rust-orange); padding: 14px 16px; margin-bottom: 10px; }
    .queue-item-info strong { font-family: 'Chakra Petch', sans-serif; font-size: 16px; color: #fff; }
    .queue-item-info span { display: block; font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .btn-del { background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 18px; }
    .empty-state { text-align: center; color: var(--text-muted); font-size: 13px; padding: 32px 0; font-family: 'JetBrains Mono', monospace; }

    .exp-pills { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .pill { background: #08090b; border: 1px solid var(--panel-border); padding: 8px 14px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #fff; }
    .pill strong { color: var(--rust-orange); margin-right: 4px; }

    /* Tables */
    .node-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    .node-table th, .node-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--panel-border); }
    .node-table th { font-family: 'Chakra Petch', sans-serif; color: var(--text-muted); text-transform: uppercase; font-size: 12px; }
    .node-table tr:hover { background: rgba(255,255,255,0.02); }

    /* Recycler Component Grid */
    .recycler-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .comp-card {
      background: #08090b;
      border: 1px solid var(--panel-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s;
    }

    .comp-card:hover { border-color: rgba(255, 68, 0, 0.5); }

    .comp-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .comp-icon { font-size: 24px; }
    .comp-name { font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 15px; color: #fff; }
    .comp-yield { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .comp-ctrls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-qty {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      color: #fff;
      width: 36px;
      height: 36px;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
    }

    .btn-qty:hover { border-color: var(--rust-orange); color: var(--rust-orange); }

    /* Tech Tree Styles */
    .wb-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .wb-btn {
      flex: 1;
      background: #08090b;
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 14px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      font-size: 14px;
    }

    .wb-btn.active {
      border-color: var(--rust-orange);
      color: #fff;
      background: rgba(255, 68, 0, 0.1);
    }

    .tree-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .tree-node {
      background: #08090b;
      border: 1px solid var(--panel-border);
      padding: 16px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .tree-node:hover { border-color: var(--text-muted); }
    .tree-node.selected {
      border-color: var(--rust-orange);
      background: rgba(255, 68, 0, 0.08);
      box-shadow: 0 0 15px rgba(255, 68, 0, 0.15);
    }

    .tree-node .node-cat {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--rust-orange);
      font-weight: 700;
    }

    .tree-node .node-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin: 6px 0;
    }

    .tree-node .node-cost {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--scrap);
    }

    .tree-node .req-tag {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      border-top: 1px dashed var(--panel-border);
      padding-top: 6px;
    }

    .badge-selected {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--rust-orange);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <div class="brand">
        <h1>Toerick <span>Rust Helper</span></h1>
      </div>
    </header>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('raidTab', this)">💥 Raid Calculator</button>
      <button class="tab-btn" onclick="switchTab('nodeTab', this)">⛏️ Node & Tool Yields</button>
      <button class="tab-btn" onclick="switchTab('recyclerTab', this)">♻️ Recycler Calculator</button>
      <button class="tab-btn" onclick="switchTab('techTreeTab', this)">🔬 Interactive Tech Tree</button>
    </div>

    <!-- TAB 1: RAID CALCULATOR -->
    <div id="raidTab" class="tab-content active">
      <div class="grid">
        <div class="panel">
          <div class="panel-title">Target Configurator</div>

          <div class="form-group">
            <label for="targetSelect">Structure / Door</label>
            <select id="targetSelect">
              <optgroup label="Doors & Hatches">
                <option value="woodDoor">Wooden Door</option>
                <option value="sheetDoor">Sheet Metal Door</option>
                <option value="garageDoor" selected>Garage Door</option>
                <option value="armoredDoor">Armored Door</option>
                <option value="ladderHatch">Ladder Hatch</option>
              </optgroup>
              <optgroup label="Walls & Floors">
                <option value="woodWall">Wooden Wall</option>
                <option value="stoneWall">Stone Wall</option>
                <option value="metalWall">Sheet Metal Wall</option>
                <option value="hqmWall">Armored (HQM) Wall</option>
              </optgroup>
              <optgroup label="Deployables">
                <option value="highWoodWall">High External Wood Wall</option>
                <option value="highStoneWall">High External Stone Wall</option>
                <option value="tc">Tool Cupboard</option>
              </optgroup>
            </select>
          </div>

          <div class="form-group">
            <label for="qtyInput">Target Quantity</label>
            <input type="number" id="qtyInput" value="1" min="1" max="100">
          </div>

          <div class="form-group">
            <label for="methodSelect">Method Strategy</label>
            <select id="methodSelect">
              <option value="optimal">⚡ Optimal / Cheapest Combo</option>
              <option value="c4">C4 Only</option>
              <option value="rocket">Rockets Only</option>
              <option value="satchel">Satchels Only</option>
              <option value="expAmmo">Explosive Ammo Only</option>
            </select>
          </div>

          <button class="btn-action" onclick="addToQueue()">+ Add Target</button>
        </div>

        <div>
          <div class="resource-row">
            <div class="res-box sulfur"><label>Total Sulfur</label><div class="val" id="totalSulfur">0</div></div>
            <div class="res-box charcoal"><label>Charcoal</label><div class="val" id="totalCharcoal">0</div></div>
            <div class="res-box gp"><label>Gunpowder</label><div class="val" id="totalGP">0</div></div>
            <div class="res-box lgf"><label>Low Grade Fuel</label><div class="val" id="totalLGF">0</div></div>
          </div>

          <div class="panel">
            <div class="panel-title">
              <span>Raid Path Queue</span>
              <button style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:11px;" onclick="clearQueue()">[ CLEAR QUEUE ]</button>
            </div>

            <ul class="queue-list" id="queueList">
              <li class="empty-state">// NO TARGETS ADDED TO RAID PATH</li>
            </ul>

            <label>Required Explosives Breakdown</label>
            <div class="exp-pills" id="explosiveBadges">
              <span class="pill">None</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 2: NODE YIELD CALCULATOR -->
    <div id="nodeTab" class="tab-content">
      <div class="grid">
        <div class="panel">
          <div class="panel-title">Node Farming Configurator</div>

          <div class="form-group">
            <label for="nodeSelect">Select Ore Node</label>
            <select id="nodeSelect" onchange="updateNodeYields()">
              <option value="sulfur">Sulfur Ore Node</option>
              <option value="metal">Metal Ore Node</option>
              <option value="stone">Stone Node</option>
            </select>
          </div>

          <div class="form-group">
            <label for="nodeCountInput">Number of Nodes</label>
            <input type="number" id="nodeCountInput" value="1" min="1" max="500" oninput="updateNodeYields()">
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">Yield Breakdown per Tool</div>
          
          <table class="node-table">
            <thead>
              <tr>
                <th>Tool</th>
                <th>Harvest Efficiency</th>
                <th>Total Yield</th>
              </tr>
            </thead>
            <tbody id="nodeYieldTableBody">
              <!-- Dynamically Populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 3: RECYCLER CALCULATOR -->
    <div id="recyclerTab" class="tab-content">
      <div class="resource-row">
        <div class="res-box scrap"><label>Total Scrap</label><div class="val" id="recScrap">0</div></div>
        <div class="res-box metal"><label>Metal Frags</label><div class="val" id="recFrags">0</div></div>
        <div class="res-box hqm"><label>HQM</label><div class="val" id="recHQM">0</div></div>
        <div class="res-box cloth"><label>Cloth</label><div class="val" id="recCloth">0</div></div>
      </div>

      <div class="panel">
        <div class="panel-title">
          <span>Outpost / Safezone Recycler Items</span>
          <button style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:11px;" onclick="clearRecycler()">[ RESET ALL ]</button>
        </div>

        <div class="recycler-grid" id="recyclerGrid">
          <!-- Dynamically Populated -->
        </div>
      </div>
    </div>

    <!-- TAB 4: INTERACTIVE TECH TREE -->
    <div id="techTreeTab" class="tab-content">
      <div class="wb-selector">
        <button class="wb-btn active" onclick="switchWbTier('t1', this)">Workbench Tier 1</button>
        <button class="wb-btn" onclick="switchWbTier('t2', this)">Workbench Tier 2</button>
        <button class="wb-btn" onclick="switchWbTier('t3', this)">Workbench Tier 3</button>
      </div>

      <div class="resource-row">
        <div class="res-box scrap"><label>Total Scrap Required</label><div class="val" id="treeTotalScrap">0</div></div>
        <div class="res-box hqm"><label>Items Selected</label><div class="val" id="treeItemCount">0</div></div>
        <div class="res-box metal"><label>Workbench Craft Cost</label><div class="val" id="treeWbCost" style="font-size:14px; margin-top:10px;">-</div></div>
      </div>

      <div class="panel">
        <div class="panel-title">
          <span id="wbTreeTitle">Workbench Tier 1 Engineering Path</span>
          <button style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:11px;" onclick="clearTechSelection()">[ CLEAR SELECTIONS ]</button>
        </div>

        <div class="tree-grid" id="treeGrid">
          <!-- Dynamically Populated -->
        </div>
      </div>
    </div>

  </div>

  <script>
    // Tab Switching Logic
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');

      if(tabId === 'nodeTab') updateNodeYields();
      if(tabId === 'recyclerTab') renderRecycler();
      if(tabId === 'techTreeTab') renderTechTree();
    }

    // ==========================================
    // 1. RAID CALCULATOR
    // ==========================================
    const EXPLOSIVES = {
      c4: { name: 'C4', sulfur: 2200, charcoal: 3000, lgf: 200 },
      rocket: { name: 'Rocket', sulfur: 1400, charcoal: 1950, lgf: 30 },
      satchel: { name: 'Satchel Charge', sulfur: 480, charcoal: 720, lgf: 0 },
      expAmmo: { name: 'Explosive Ammo', sulfur: 25, charcoal: 30, lgf: 0 }
    };

    const TARGETS = {
      woodDoor:      { name: 'Wooden Door', hp: 200, damage: { c4: 550, rocket: 220, satchel: 105, expAmmo: 11.2 } },
      sheetDoor:     { name: 'Sheet Metal Door', hp: 250, damage: { c4: 550, rocket: 220, satchel: 70, expAmmo: 4 } },
      garageDoor:    { name: 'Garage Door', hp: 600, damage: { c4: 550, rocket: 220, satchel: 70, expAmmo: 4 } },
      armoredDoor:   { name: 'Armored Door', hp: 1000, damage: { c4: 550, rocket: 275, satchel: 85, expAmmo: 5 } },
      ladderHatch:   { name: 'Ladder Hatch', hp: 250, damage: { c4: 550, rocket: 220, satchel: 70, expAmmo: 4 } },
      woodWall:      { name: 'Wooden Wall', hp: 250, damage: { c4: 550, rocket: 220, satchel: 90, expAmmo: 5.1 } },
      stoneWall:     { name: 'Stone Wall', hp: 500, damage: { c4: 275, rocket: 137.5, satchel: 52.5, expAmmo: 2.7 } },
      metalWall:     { name: 'Sheet Metal Wall', hp: 1000, damage: { c4: 275, rocket: 137.5, satchel: 43.5, expAmmo: 2.5 } },
      hqmWall:       { name: 'Armored Wall', hp: 2000, damage: { c4: 275, rocket: 137.5, satchel: 43.5, expAmmo: 2 } },
      highWoodWall:  { name: 'High External Wood Wall', hp: 600, damage: { c4: 550, rocket: 220, satchel: 105, expAmmo: 6.2 } },
      highStoneWall: { name: 'High External Stone Wall', hp: 1000, damage: { c4: 550, rocket: 275, satchel: 105, expAmmo: 5.5 } },
      tc:            { name: 'Tool Cupboard', hp: 100, damage: { c4: 550, rocket: 220, satchel: 105, expAmmo: 34 } }
    };

    let raidQueue = [];

    function calculateCheapestCombo(targetKey) {
      const target = TARGETS[targetKey];
      let bestCost = Infinity;
      let bestCounts = { c4: 0, rocket: 0, satchel: 0, expAmmo: 0 };

      const maxC4 = Math.ceil(target.hp / target.damage.c4);
      const maxRockets = Math.ceil(target.hp / target.damage.rocket);

      for (let c4 = 0; c4 <= maxC4; c4++) {
        for (let r = 0; r <= maxRockets; r++) {
          const mainDamage = (c4 * target.damage.c4) + (r * target.damage.rocket);
          const remHP = target.hp - mainDamage;

          if (remHP <= 0) {
            const cost = (c4 * EXPLOSIVES.c4.sulfur) + (r * EXPLOSIVES.rocket.sulfur);
            if (cost < bestCost) { bestCost = cost; bestCounts = { c4, rocket: r, satchel: 0, expAmmo: 0 }; }
            continue;
          }

          const satchels = Math.ceil(remHP / target.damage.satchel);
          const satchelCost = (c4 * EXPLOSIVES.c4.sulfur) + (r * EXPLOSIVES.rocket.sulfur) + (satchels * EXPLOSIVES.satchel.sulfur);
          if (satchelCost < bestCost) { bestCost = satchelCost; bestCounts = { c4, rocket: r, satchel: satchels, expAmmo: 0 }; }

          const expAmmo = Math.ceil(remHP / target.damage.expAmmo);
          const expAmmoCost = (c4 * EXPLOSIVES.c4.sulfur) + (r * EXPLOSIVES.rocket.sulfur) + (expAmmo * EXPLOSIVES.expAmmo.sulfur);
          if (expAmmoCost < bestCost) { bestCost = expAmmoCost; bestCounts = { c4, rocket: r, satchel: 0, expAmmo }; }
        }
      }
      return bestCounts;
    }

    function addToQueue() {
      const targetKey = document.getElementById('targetSelect').value;
      const qty = parseInt(document.getElementById('qtyInput').value) || 1;
      const method = document.getElementById('methodSelect').value;

      raidQueue.push({ id: Date.now(), targetKey, qty, method });
      updateUI();
    }

    function removeFromQueue(id) { raidQueue = raidQueue.filter(item => item.id !== id); updateUI(); }
    function clearQueue() { raidQueue = []; updateUI(); }

    function updateUI() {
      const queueListEl = document.getElementById('queueList');
      const explosiveBadgesEl = document.getElementById('explosiveBadges');
      let totals = { sulfur: 0, charcoal: 0, lgf: 0, c4: 0, rocket: 0, satchel: 0, expAmmo: 0 };

      queueListEl.innerHTML = raidQueue.length === 0 ? `<li class="empty-state">// NO TARGETS ADDED TO RAID PATH</li>` : '';

      raidQueue.forEach(item => {
        const target = TARGETS[item.targetKey];
        let counts = { c4: 0, rocket: 0, satchel: 0, expAmmo: 0 };

        if (item.method === 'optimal') {
          const singleCombo = calculateCheapestCombo(item.targetKey);
          Object.keys(singleCombo).forEach(k => counts[k] = singleCombo[k] * item.qty);
        } else {
          const countSingle = Math.ceil(target.hp / target.damage[item.method]);
          counts[item.method] = countSingle * item.qty;
        }

        Object.keys(counts).forEach(k => totals[k] += counts[k]);
        const expSummary = Object.entries(counts).filter(([_, v]) => v > 0).map(([k, v]) => `${v}x ${EXPLOSIVES[k].name}`).join(', ');

        const li = document.createElement('li');
        li.className = 'queue-item';
        li.innerHTML = `
          <div class="queue-item-info">
            <strong>${item.qty}x ${target.name}</strong>
            <span>Strategy: ${item.method.toUpperCase()} (${expSummary})</span>
          </div>
          <button class="btn-del" onclick="removeFromQueue(${item.id})">✕</button>
        `;
        queueListEl.appendChild(li);
      });

      totals.sulfur = (totals.c4 * EXPLOSIVES.c4.sulfur) + (totals.rocket * EXPLOSIVES.rocket.sulfur) + (totals.satchel * EXPLOSIVES.satchel.sulfur) + (totals.expAmmo * EXPLOSIVES.expAmmo.sulfur);
      totals.charcoal = (totals.c4 * EXPLOSIVES.c4.charcoal) + (totals.rocket * EXPLOSIVES.rocket.charcoal) + (totals.satchel * EXPLOSIVES.satchel.charcoal) + (totals.expAmmo * EXPLOSIVES.expAmmo.charcoal);
      totals.lgf = (totals.c4 * EXPLOSIVES.c4.lgf) + (totals.rocket * EXPLOSIVES.rocket.lgf);

      document.getElementById('totalSulfur').innerText = totals.sulfur.toLocaleString();
      document.getElementById('totalCharcoal').innerText = totals.charcoal.toLocaleString();
      document.getElementById('totalGP').innerText = Math.floor(totals.sulfur / 2).toLocaleString();
      document.getElementById('totalLGF').innerText = totals.lgf.toLocaleString();

      const badgeList = Object.entries({ C4: totals.c4, Rockets: totals.rocket, Satchels: totals.satchel, 'Exp Ammo': totals.expAmmo })
        .filter(([_, count]) => count > 0)
        .map(([name, count]) => `<span class="pill"><strong>${count.toLocaleString()}</strong> ${name}</span>`)
        .join('');

      explosiveBadgesEl.innerHTML = badgeList || `<span class="pill">None</span>`;
    }

    // ==========================================
    // 2. NODE FARMING LOGIC
    // ==========================================
    const TOOLS = [
      { name: 'Rock', eff: 0.66 },
      { name: 'Bone Pickaxe', eff: 0.75 },
      { name: 'Stone Pickaxe', eff: 0.80 },
      { name: 'Pickaxe', eff: 1.0 },
      { name: 'Salvaged Icepick', eff: 1.0 },
      { name: 'Jackhammer', eff: 1.0 }
    ];

    const NODE_DATA = {
      sulfur: { name: 'Sulfur Ore Node', primary: 'Sulfur Ore', basePrimary: 300 },
      metal: { name: 'Metal Ore Node', primary: 'Metal Ore', basePrimary: 600 },
      stone: { name: 'Stone Node', primary: 'Stone', basePrimary: 1000 }
    };

    function updateNodeYields() {
      const nodeKey = document.getElementById('nodeSelect').value;
      const count = parseInt(document.getElementById('nodeCountInput').value) || 1;
      const node = NODE_DATA[nodeKey];
      const tbody = document.getElementById('nodeYieldTableBody');

      tbody.innerHTML = '';

      TOOLS.forEach(tool => {
        const primaryYield = Math.floor(node.basePrimary * tool.eff * count);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${tool.name}</strong></td>
          <td>${Math.floor(tool.eff * 100)}%</td>
          <td style="color:var(--rust-orange); font-weight:bold;">${primaryYield.toLocaleString()} ${node.primary}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ==========================================
    // 3. RECYCLER CALCULATOR LOGIC
    // ==========================================
    const RECYCLER_ITEMS = [
      { id: 'techtrash', name: 'Tech Trash', scrap: 20, hqm: 1, frags: 0, cloth: 0, icon: '📟' },
      { id: 'gears', name: 'Gears', scrap: 10, hqm: 0, frags: 13, cloth: 0, icon: '⚙️' },
      { id: 'pipe', name: 'Metal Pipe', scrap: 5, hqm: 2, frags: 0, cloth: 0, icon: '🥢' },
      { id: 'spring', name: 'Metal Spring', scrap: 10, hqm: 1, frags: 0, cloth: 0, icon: '🌀' },
      { id: 'riflebody', name: 'Rifle Body', scrap: 25, hqm: 2, frags: 0, cloth: 0, icon: '🔫' },
      { id: 'smgbody', name: 'SMG Body', scrap: 15, hqm: 2, frags: 0, cloth: 0, icon: '🔫' },
      { id: 'semibody', name: 'Semi Body', scrap: 15, hqm: 2, frags: 75, cloth: 0, icon: '🔫' },
      { id: 'roadsigns', name: 'Road Signs', scrap: 5, hqm: 1, frags: 0, cloth: 0, icon: '🛡️' },
      { id: 'sheetmetal', name: 'Sheet Metal', scrap: 8, hqm: 1, frags: 100, cloth: 0, icon: '📦' },
      { id: 'tarp', name: 'Tarp', scrap: 0, hqm: 0, frags: 0, cloth: 50, icon: '⛺' },
      { id: 'rope', name: 'Rope', scrap: 0, hqm: 0, frags: 0, cloth: 15, icon: '🪢' },
      { id: 'sewingkit', name: 'Sewing Kit', scrap: 0, hqm: 0, frags: 0, cloth: 60, icon: '🧵' },
      { id: 'blade', name: 'Metal Blade', scrap: 2, hqm: 0, frags: 15, cloth: 0, icon: '🔪' },
      { id: 'fuse', name: 'Electric Fuse', scrap: 20, hqm: 0, frags: 0, cloth: 0, icon: '🔌' },
      { id: 'cctv', name: 'CCTV Camera', scrap: 40, hqm: 4, frags: 0, cloth: 0, icon: '📷' },
      { id: 'laptop', name: 'Targeting Computer', scrap: 60, hqm: 4, frags: 50, cloth: 0, icon: '💻' }
    ];

    let recyclerState = {};

    function renderRecycler() {
      const grid = document.getElementById('recyclerGrid');
      grid.innerHTML = '';

      RECYCLER_ITEMS.forEach(item => {
        const qty = recyclerState[item.id] || 0;
        const yieldText = [
          item.scrap ? `${item.scrap} Scrap` : '',
          item.hqm ? `${item.hqm} HQM` : '',
          item.frags ? `${item.frags} Frags` : '',
          item.cloth ? `${item.cloth} Cloth` : ''
        ].filter(Boolean).join(' | ');

        const card = document.createElement('div');
        card.className = 'comp-card';
        card.innerHTML = `
          <div class="comp-header">
            <div class="comp-icon">${item.icon}</div>
            <div>
              <div class="comp-name">${item.name}</div>
              <div class="comp-yield">Yield: ${yieldText}</div>
            </div>
          </div>
          <div class="comp-ctrls">
            <button class="btn-qty" onclick="adjustRecQty('${item.id}', -10)">-10</button>
            <button class="btn-qty" onclick="adjustRecQty('${item.id}', -1)">-1</button>
            <input type="number" value="${qty}" min="0" oninput="setRecQty('${item.id}', this.value)" style="text-align:center;">
            <button class="btn-qty" onclick="adjustRecQty('${item.id}', 1)">+1</button>
            <button class="btn-qty" onclick="adjustRecQty('${item.id}', 10)">+10</button>
          </div>
        `;
        grid.appendChild(card);
      });

      calculateRecyclerTotals();
    }

    function adjustRecQty(id, delta) {
      recyclerState[id] = Math.max(0, (recyclerState[id] || 0) + delta);
      renderRecycler();
    }

    function setRecQty(id, val) {
      recyclerState[id] = Math.max(0, parseInt(val) || 0);
      calculateRecyclerTotals();
    }

    function clearRecycler() {
      recyclerState = {};
      renderRecycler();
    }

    function calculateRecyclerTotals() {
      let totals = { scrap: 0, frags: 0, hqm: 0, cloth: 0 };

      RECYCLER_ITEMS.forEach(item => {
        const qty = recyclerState[item.id] || 0;
        totals.scrap += item.scrap * qty;
        totals.frags += item.frags * qty;
        totals.hqm += item.hqm * qty;
        totals.cloth += item.cloth * qty;
      });

      document.getElementById('recScrap').innerText = totals.scrap.toLocaleString();
      document.getElementById('recFrags').innerText = totals.frags.toLocaleString();
      document.getElementById('recHQM').innerText = totals.hqm.toLocaleString();
      document.getElementById('recCloth').innerText = totals.cloth.toLocaleString();
    }

    // ==========================================
    // 4. TECH TREE CALCULATOR LOGIC
    // ==========================================
    const TECH_TREES = {
      t1: {
        title: "Tier 1 Workbench (Engineering & Starter)",
        wbCost: "50 Scrap + 500 Wood + 100 Metal",
        items: [
          { id: 't1_ladder', name: 'Wooden Ladder', scrap: 125, cat: 'Utility', req: [] },
          { id: 't1_revolver', name: 'Revolver', scrap: 75, cat: 'Weapons', req: [] },
          { id: 't1_ammo', name: 'Pistol Bullet', scrap: 75, cat: 'Ammo', req: ['t1_revolver'] },
          { id: 't1_pipe', name: 'Waterpipe Shotgun', scrap: 75, cat: 'Weapons', req: [] },
          { id: 't1_eoka', name: 'Eoka Pistol', scrap: 20, cat: 'Weapons', req: [] },
          { id: 't1_firearrow', name: 'Fire Arrow', scrap: 75, cat: 'Ammo', req: [] },
          { id: 't1_stash', name: 'Small Stash', scrap: 20, cat: 'Storage', req: [] },
          { id: 't1_mixing', name: 'Mixing Table', scrap: 75, cat: 'Utility', req: [] },
          { id: 't1_barricade', name: 'Wooden Barricade', scrap: 20, cat: 'Defense', req: [] }
        ]
      },
      t2: {
        title: "Tier 2 Workbench (Main Progression)",
        wbCost: "500 Scrap + 20 HQM + 500 Metal",
        items: [
          { id: 't2_syringe', name: 'Medical Syringe', scrap: 75, cat: 'Medical', req: [] },
          { id: 't2_medkit', name: 'Large Medkit', scrap: 125, cat: 'Medical', req: ['t2_syringe'] },
          { id: 't2_garagedoor', name: 'Garage Door', scrap: 75, cat: 'Building', req: [] },
          { id: 't2_tommy', name: 'Thompson SMG', scrap: 125, cat: 'Weapons', req: [] },
          { id: 't2_custom', name: 'Custom SMG', scrap: 125, cat: 'Weapons', req: [] },
          { id: 't2_sar', name: 'Semi-Automatic Rifle', scrap: 125, cat: 'Weapons', req: [] },
          { id: 't2_556', name: '5.56 Ammo', scrap: 125, cat: 'Ammo', req: ['t2_sar'] },
          { id: 't2_beancan', name: 'Beancan Grenade', scrap: 75, cat: 'Explosives', req: [] },
          { id: 't2_satchel', name: 'Satchel Charge', scrap: 125, cat: 'Explosives', req: ['t2_beancan'] },
          { id: 't2_expammo', name: 'Explosive Ammo', scrap: 125, cat: 'Explosives', req: ['t2_556'] }
        ]
      },
      t3: {
        title: "Tier 3 Workbench (Endgame)",
        wbCost: "1,250 Scrap + 100 HQM + 1,000 Metal",
        items: [
          { id: 't3_ak', name: 'Assault Rifle (AK-47)', scrap: 500, cat: 'Weapons', req: [] },
          { id: 't3_bolt', name: 'Bolt Action Rifle', scrap: 500, cat: 'Weapons', req: [] },
          { id: 't3_facemask', name: 'Metal Facemask', scrap: 500, cat: 'Armor', req: [] },
          { id: 't3_chestplate', name: 'Metal Chestplate', scrap: 500, cat: 'Armor', req: ['t3_facemask'] },
          { id: 't3_launcher', name: 'Rocket Launcher', scrap: 500, cat: 'Explosives', req: [] },
          { id: 't3_rocket', name: 'Rocket', scrap: 500, cat: 'Explosives', req: ['t3_launcher'] },
          { id: 't3_c4', name: 'Timed Explosive Charge (C4)', scrap: 500, cat: 'Explosives', req: ['t3_rocket'] },
          { id: 't3_hvrocket', name: 'HV Rocket', scrap: 500, cat: 'Explosives', req: ['t3_launcher'] }
        ]
      }
    };

    let activeTier = 't1';
    let selectedTechNodes = new Set();

    function switchWbTier(tier, btn) {
      document.querySelectorAll('.wb-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTier = tier;
      renderTechTree();
    }

    function toggleTechNode(itemId) {
      if (selectedTechNodes.has(itemId)) {
        selectedTechNodes.delete(itemId);
      } else {
        selectedTechNodes.add(itemId);
        // Auto-select prerequisites
        autoSelectReqs(itemId);
      }
      renderTechTree();
    }

    function autoSelectReqs(itemId) {
      const tierData = TECH_TREES[activeTier];
      const item = tierData.items.find(i => i.id === itemId);
      if (item && item.req) {
        item.req.forEach(reqId => {
          selectedTechNodes.add(reqId);
          autoSelectReqs(reqId);
        });
      }
    }

    function clearTechSelection() {
      selectedTechNodes.clear();
      renderTechTree();
    }

    function renderTechTree() {
      const tierData = TECH_TREES[activeTier];
      document.getElementById('wbTreeTitle').innerText = tierData.title;
      document.getElementById('treeWbCost').innerText = tierData.wbCost;

      const grid = document.getElementById('treeGrid');
      grid.innerHTML = '';

      let totalScrap = 0;
      let count = 0;

      tierData.items.forEach(item => {
        const isSelected = selectedTechNodes.has(item.id);
        if (isSelected) {
          totalScrap += item.scrap;
          count++;
        }

        const node = document.createElement('div');
        node.className = `tree-node ${isSelected ? 'selected' : ''}`;
        node.onclick = () => toggleTechNode(item.id);

        const reqNames = item.req.map(rId => {
          const reqItem = tierData.items.find(i => i.id === rId);
          return reqItem ? reqItem.name : rId;
        }).join(', ');

        node.innerHTML = `
          ${isSelected ? '<span class="badge-selected">Selected</span>' : ''}
          <div class="node-cat">${item.cat}</div>
          <div class="node-title">${item.name}</div>
          <div class="node-cost">${item.scrap} Scrap</div>
          ${reqNames ? `<div class="req-tag">Requires: ${reqNames}</div>` : ''}
        `;

        grid.appendChild(node);
      });

      document.getElementById('treeTotalScrap').innerText = totalScrap.toLocaleString();
      document.getElementById('treeItemCount').innerText = count.toLocaleString();
    }
  </script>
</body>
</html>
